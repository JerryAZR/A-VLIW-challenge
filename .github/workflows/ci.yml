name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # badge-branch push (kept off main: no CI retrigger)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # All checks run with continue-on-error so every badge signal is
      # computed on every run (a 1536-scratch deadlock must not hide the
      # relaxed-scratch result, and vice versa). The Gate step at the end
      # decides overall CI red/green.
      - name: Unit tests (dev_tests)
        id: units
        continue-on-error: true
        run: python -m unittest discover dev_tests

      - name: Correctness oracle, relaxed scratch 4096 (_check_big)
        id: check4096
        continue-on-error: true
        run: python -m tools._check_big 4096

      - name: Correctness oracle, real-machine scratch 1536 (_check)
        id: check1536
        continue-on-error: true
        run: python -m tools._check

      - name: Submission tests (graded cycle count, 1536 scratch)
        id: submission
        continue-on-error: true
        run: |
          python tests/submission_tests.py | tee submission.out || true
          cyc=$(grep -oP 'CYCLES:\s+\K\d+' submission.out | head -1 || true)
          echo "cycles=$cyc" >> "$GITHUB_OUTPUT"
          echo "graded cycles: ${cyc:-none (schedule deadlocks at 1536)}"

      # --- badge payloads, pushed to the dedicated "badge" branch ---
      - name: Write badge payloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CYCLES: ${{ steps.submission.outputs.cycles }}
          CHECK1536: ${{ steps.check1536.outcome }}
          CHECK4096: ${{ steps.check4096.outcome }}
        run: |
          python - <<'EOF'
          import json, os
          payloads = {}
          cyc = os.environ["CYCLES"]
          if cyc.isdigit():
              c = int(cyc)
              color = ("brightgreen" if c < 1363 else
                       "green" if c < 1487 else "yellow")
              payloads["cycles"] = {"schemaVersion": 1, "label": "cycles",
                                    "message": f"{c:,}", "color": color}
          else:
              # schedule does not fit the real 1536-word scratch
              payloads["cycles"] = {"schemaVersion": 1,
                                    "label": "cycles @1536",
                                    "message": "deadlock", "color": "red"}
          for name, outcome in (("check1536", os.environ["CHECK1536"]),
                                ("check4096", os.environ["CHECK4096"])):
              msg, color = (("pass", "brightgreen") if outcome == "success"
                            else ("fail", "red"))
              payloads[name] = {"schemaVersion": 1,
                                "label": f"check \u00b7 {name[5:]} scratch",
                                "message": msg, "color": color}
          for name, p in payloads.items():
              with open(f"/tmp/{name}.json", "w") as f:
                  json.dump(p, f)
          EOF

      - name: Push payloads to badge branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CYCLES: ${{ steps.submission.outputs.cycles }}
          CHECK1536: ${{ steps.check1536.outcome }}
          CHECK4096: ${{ steps.check4096.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badge > /dev/null; then
            git fetch origin badge
            git checkout badge
          else
            git checkout --orphan badge
            git rm -rf .
          fi
          cp /tmp/cycles.json /tmp/check1536.json /tmp/check4096.json .
          git add cycles.json check1536.json check4096.json
          git commit -m "badges: cycles=${CYCLES:-deadlock} 1536=${CHECK1536} 4096=${CHECK4096}" \
            || echo "badges unchanged"
          git push origin badge

      # CI is red iff the machinery is broken (unit tests) or the kernel's
      # DATAFLOW is wrong (relaxed-scratch oracle). A 1536 deadlock is a
      # register-fit state, not a correctness failure - it shows on the
      # "check · 1536 scratch" badge instead of failing the build.
      - name: Gate (unit tests + relaxed correctness must pass)
        if: always()
        run: |
          [ "${{ steps.units.outcome }}" = "success" ] \
            || { echo "::error::unit tests failed"; exit 1; }
          [ "${{ steps.check4096.outcome }}" = "success" ] \
            || { echo "::error::relaxed-scratch correctness (4096) failed - dataflow broken"; exit 1; }
